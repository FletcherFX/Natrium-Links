<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natrium Links</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="main-title">NATRIUM</h1>
        
        <div class="links-grid">
            <a id="site-link" href="#" target="_blank" class="link-card w-12 icon-site">
                <img src="assets/site.webp" alt="">
                <span>Официальный сайт</span>
            </a>
            
            <a id="mineinside-link" href="#" target="_blank" class="link-card w-7 icon-mine">
                <img src="assets/mineinside.webp" alt="">
                <span>Minecraft Inside</span>
            </a>
            <a id="github-link" href="#" target="_blank" class="link-card w-5">
                <img src="assets/github.webp" alt="">
                <span>GitHub репозиторий</span>
            </a>
            
            <a id="tgchat-link" href="#" target="_blank" class="link-card w-4">
                <img src="assets/tg.webp" alt="">
                <span>Telegram Chat</span>
            </a>
            <a id="tgchannel-link" href="#" target="_blank" class="link-card w-8">
                <img src="assets/tg.webp" alt="">
                <span>Telegram Channel</span>
            </a>
            
            <a id="bug-link" href="#" target="_blank" class="link-card w-4">
                <img src="assets/warn.webp" alt="">
                <span>Сообщить о баге</span>
            </a>
            <a id="da-link" href="#" target="_blank" class="link-card w-4">
                <img src="assets/da.webp" alt="">
                <span>Donation Alerts</span>
            </a>
            <a id="modrinth-link" href="#" target="_blank" class="link-card w-4">
                <img src="assets/modrinth.webp" alt="">
                <span>Modrinth — скоро</span>
            </a>
        </div>
    </div>

    <script src="links.js"></script>
</body>
</html>
