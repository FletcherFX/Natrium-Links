<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natrium Links</title>
    <link rel="icon" type="image/webp" href="assets/favicon.webp">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video id="bg-video" class="bg-video" autoplay loop muted playsinline preload="auto">
        <source src="assets/bk.mp4" type="video/mp4">
    </video>

    <div class="container">
        <h1 class="main-title">NATRIUM</h1>
        
        <div class="lang-container">
            <button id="lang-btn" class="lang-btn">RU</button>
        </div>
        
        <div class="links-grid">
            <a id="site-link" href="#" target="_blank" class="link-card w-12 icon-site">
                <span class="card-inner">
                    <img src="assets/site.webp" alt="">
                    <span id="txt-site">Официальный сайт</span>
                </span>
            </a>
            
            <a id="mineinside-link" href="#" target="_blank" class="link-card w-7 icon-mine">
                <span class="card-inner">
                    <img src="assets/mineinside.webp" alt="">
                    <span id="txt-mine">Minecraft Inside</span>
                </span>
            </a>
            <a id="github-link" href="#" target="_blank" class="link-card w-5">
                <span class="card-inner">
                    <img src="assets/github.webp" alt="">
                    <span id="txt-github">GitHub репозиторий</span>
                </span>
            </a>
            
            <a id="tgchat-link" href="#" target="_blank" class="link-card w-4 icon-tg">
                <span class="card-inner">
                    <img src="assets/tg.webp" alt="">
                    <span id="txt-tgchat">Telegram Chat</span>
                </span>
            </a>
            <a id="tgchannel-link" href="#" target="_blank" class="link-card w-8 icon-tg">
                <span class="card-inner">
                    <img src="assets/tg.webp" alt="">
                    <span id="txt-tgchannel">Telegram Channel</span>
                </span>
            </a>
            
            <a id="bug-link" href="#" target="_blank" class="link-card w-4">
                <span class="card-inner">
                    <img src="assets/warn.webp" alt="">
                    <span id="txt-bug">Сообщить о баге</span>
                </span>
            </a>
            <a id="da-link" href="#" target="_blank" class="link-card w-4">
                <span class="card-inner">
                    <img src="assets/da.webp" alt="">
                    <span id="txt-da">Donation Alerts</span>
                </span>
            </a>
            <a id="modrinth-link" href="#" target="_blank" class="link-card w-4">
                <span class="card-inner">
                    <img src="assets/modrinth.webp" alt="">
                    <span id="txt-modrinth">Modrinth — скоро</span>
                </span>
            </a>
        </div>
    </div>

    <script src="links.js"></script>
</body>
</html>
